name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Scripts and extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check shell scripts
        run: bash -n install.sh scripts/autostart.sh macos/build.sh
      - name: Check extension syntax
        run: |
          for file in gnome-extension/*/*.js; do
            node --check "$file"
          done
      - name: Check desktop positioning
        run: node --test tests/position.test.mjs

  build:
    name: Build
    uses: ./.github/workflows/build.yml
