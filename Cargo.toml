[package]
name = "megalith-widgets"
version = "0.1.0"
edition = "2024"
description = "A desktop widget for the GitHub pull requests waiting on your review"
rust-version = "1.88"
license = "GPL-3.0-only"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.8.1", optional = true }
pango = { version = "0.22", features = ["v1_56"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["layer-shell"]
layer-shell = ["dep:gtk4-layer-shell"]
